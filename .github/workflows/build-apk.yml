name: VYORA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "migration/innertubex/**"
      - ".github/workflows/build-apk.yml"
      - "nexa-music-nov-21-2026-10-08-24-pm.zip"

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

jobs:
  build:
    name: Migrate InnerTubeX and build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout VYORA source archive and migration patch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools are missing from the runner image."
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "ANDROID_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: '"$ANDROID_SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Extract latest uploaded VYORA source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vyora-source"
          python3 -m zipfile -e "$GITHUB_WORKSPACE/nexa-music-nov-21-2026-10-08-24-pm.zip" "$RUNNER_TEMP/vyora-source"
          PROJECT_ROOT="$(find "$RUNNER_TEMP/vyora-source" -type f -path '*/app/build.gradle.kts' -print -quit | xargs -r dirname | xargs -r dirname)"
          test -n "$PROJECT_ROOT"
          echo "VYORA_PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Package current playback source modules
        shell: bash
        run: |
          set -euo pipefail
          SNAPSHOT="$RUNNER_TEMP/vyora-playback-source"
          mkdir -p "$SNAPSHOT"
          cp "$VYORA_PROJECT_ROOT/app/build.gradle.kts" "$SNAPSHOT/app-build.gradle.kts"
          cp "$VYORA_PROJECT_ROOT/settings.gradle.kts" "$SNAPSHOT/settings.gradle.kts"
          cp "$VYORA_PROJECT_ROOT/app/src/main/java/com/vyorasound/app/VyoraApplication.kt" "$SNAPSHOT/"
          cp "$VYORA_PROJECT_ROOT/app/src/main/java/com/vyorasound/app/repository/InnerTubeMusicRepository.kt" "$SNAPSHOT/"
          cp "$VYORA_PROJECT_ROOT/app/src/main/java/com/vyorasound/app/network/InnerTubeClientConfig.kt" "$SNAPSHOT/"
          cp "$VYORA_PROJECT_ROOT/app/src/main/java/com/vyorasound/app/network/InnerTubeApiService.kt" "$SNAPSHOT/"
          cp "$VYORA_PROJECT_ROOT/app/src/main/java/com/vyorasound/app/network/NetworkModule.kt" "$SNAPSHOT/"
          cp "$VYORA_PROJECT_ROOT/app/src/main/java/com/vyorasound/app/domain/model/MusicModels.kt" "$SNAPSHOT/"
          (cd "$SNAPSHOT" && zip -q -r "$RUNNER_TEMP/vyora-playback-source.zip" .)

      - name: Inspect latest source resolver layout
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["VYORA_PROJECT_ROOT"])
          out = Path(os.environ["RUNNER_TEMP"]) / "vyora-source-inspection.txt"
          terms = re.compile(r"yt.?dlp|youtube.?dl|stream.?resolv|playbackstream|audio.?resolver|YoutubeDL", re.I)
          with out.open("w", encoding="utf-8") as report:
              report.write("PROJECT_ROOT " + str(root) + "\n")
              for path in sorted(root.rglob("*.kt")):
                  report.write("KOTLIN_FILE " + str(path.relative_to(root)) + "\n")
                  for number, line in enumerate(path.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
                      if terms.search(line):
                          report.write("MATCH " + str(path.relative_to(root)) + ":" + str(number) + ": " + line.strip()[:300] + "\n")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Apply InnerTubeX migration
        run: |
          python3 migration/innertubex/apply_migration.py \
            --source-root "$VYORA_PROJECT_ROOT" \
            --resolver-source "$GITHUB_WORKSPACE/migration/innertubex/InnerTubeXStreamResolver.kt"

      - name: Build debug APK
        working-directory: ${{ env.VYORA_PROJECT_ROOT }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VYORA-debug-apk-innertubex
          path: ${{ env.VYORA_PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload source inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VYORA-source-inspection
          path: ${{ runner.temp }}/vyora-source-inspection.txt
          if-no-files-found: warn
          retention-days: 3

      - name: Upload playback source modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VYORA-playback-source
          path: ${{ runner.temp }}/vyora-playback-source.zip
          if-no-files-found: warn
          retention-days: 3
